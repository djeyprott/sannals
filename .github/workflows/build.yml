name: Build and release

# Every push and pull request builds and tests on all three platforms.
#
# Publishing a release, any of these:
#   - Change the number in VERSION and push to main. If tag v<VERSION> doesn't
#     exist yet, the workflow creates it and publishes the release.
#   - Actions tab > "Build and release" > Run workflow, with a version.
#   - Push a v* tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, e.g. v0.2.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Decide release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          publish=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            tag="$INPUT_VERSION"; publish=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"; publish=true
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "$tag already released; build only."
            else
              publish=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag, publish: $publish"

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-universal
          - os: ubuntu-22.04
            name: linux-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Configure
        run: |
          extra=""
          if [ "$RUNNER_OS" = "macOS" ]; then extra="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $extra

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Smoke test (100-year headless run)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then bin=build/Release; ext=.exe; else bin=build; ext=; fi
          "$bin/stellar_annals$ext" --seed 42 --years 100 --summary

      - name: Package
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then bin=build/Release; ext=.exe; else bin=build; ext=; fi
          dir=stellar-annals-${{ matrix.name }}
          mkdir -p "dist/$dir"
          cp "$bin/stellar_annals$ext" "$bin/stellar_annals_viewer$ext" README.md "dist/$dir/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            tar -czf "$dir.tar.gz" "$dir"
          fi
          rm -rf "$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: stellar-annals-${{ matrix.name }}
          path: dist/*

  release:
    name: Publish release
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Stellar Annals ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
