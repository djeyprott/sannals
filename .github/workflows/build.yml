name: Build and release

# Every push and pull request builds and tests on all three platforms.
# Pushing a tag like v0.2.0 also publishes the builds as a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-14
            name: macos-universal
          - os: ubuntu-22.04
            name: linux-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Configure
        run: |
          extra=""
          if [ "$RUNNER_OS" = "macOS" ]; then extra="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $extra

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Smoke test (100-year headless run)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then bin=build/Release; ext=.exe; else bin=build; ext=; fi
          "$bin/stellar_annals$ext" --seed 42 --years 100 --summary

      - name: Package
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then bin=build/Release; ext=.exe; else bin=build; ext=; fi
          dir=stellar-annals-${{ matrix.name }}
          mkdir -p "dist/$dir"
          cp "$bin/stellar_annals$ext" "$bin/stellar_annals_viewer$ext" README.md "dist/$dir/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            tar -czf "$dir.tar.gz" "$dir"
          fi
          rm -rf "$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: stellar-annals-${{ matrix.name }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
